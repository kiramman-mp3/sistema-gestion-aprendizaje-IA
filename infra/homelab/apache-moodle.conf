# Apache del Moodle del homelab (docker-compose.homelab.yml). Moodle 5.1 sirve el sitio desde public/.
# Además de la raíz, lo sirve bajo /lms: así un proxy puede publicarlo en una ruta de un puerto compartido
# (tailscale funnel con --set-path /lms) y la ruta de cada petición coincide con la de wwwroot.
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public
    Alias /lms /var/www/html/public

    <Directory /var/www/html/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
