name: CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**", "refactor/**", "chore/**", "docs/**", "ci/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Lint, test y build (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Linter
        run: pnpm lint

      - name: Formato
        run: pnpm format:check

      - name: Contrato OpenAPI
        run: pnpm lint:api

      - name: Tipos
        run: pnpm typecheck

      - name: Pruebas
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Módulos AMD del plugin al día
        run: pnpm check:amd

  php:
    name: Estándar de código Moodle (PHP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: phpcs con moodle-cs
        run: bash infra/scripts/phpcs.sh
