name: Error
description: Algo no funciona como dice la documentación
labels: ["error"]
body:
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      description: Comandos o acciones exactas. Usa solo datos sintéticos.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas y qué pasó
      description: Incluye el mensaje de error exacto, sin tokens, contraseñas ni datos personales.
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Entorno
      placeholder: "Windows 11, Node 26, rama develop @ abc1234"
