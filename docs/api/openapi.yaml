openapi: 3.1.0
info:
  title: API del LMS inteligente
  version: 0.1.0
  description: |
    Contrato v0 (Sprint 1) del backend. Todas las rutas requieren un JWT de vida corta firmado por el
    plugin de Moodle (ADR-006). El backend valida rol y capacidades en el curso en cada petición
    (ADR-007). Los ejemplos no contienen datos reales.
  license:
    name: Por definir
    identifier: UNLICENSED
servers:
  - url: http://localhost:3000/api/v1
    description: Desarrollo local
security:
  - pluginJwt: []
tags:
  - name: syllabi
    description: Carga y extracción de sílabos (CU-01)
  - name: proposals
    description: Propuestas de estructura de curso (CU-02, CU-03)
  - name: assistant
    description: Asistente conversacional (CU-04)
  - name: analytics
    description: Indicadores, evidencias y recomendaciones (CU-05)
  - name: mappings
    description: Relación de las actividades de Moodle con las unidades del sílabo
  - name: admin
    description: Configuración y auditoría (CU-06, CU-07)
  - name: health
    description: Estado del servicio

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Estado del backend y sus dependencias
      security: []
      responses:
        "200":
          description: Estado de cada dependencia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /session:
    get:
      tags: [health]
      operationId: getSession
      summary: Identidad verificada del usuario y sus capacidades en el curso del token
      description: Permite al plugin comprobar la conexión con el backend.
      responses:
        "200":
          description: Identidad
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: |
            Autenticación no configurada (`AUTH_NOT_CONFIGURED`), registro de tokens no disponible
            (`AUTH_UNAVAILABLE`) o Moodle no respondió al verificar permisos (`MOODLE_UNAVAILABLE`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /syllabi:
    post:
      tags: [syllabi]
      operationId: uploadSyllabus
      summary: Cargar un sílabo (RF-03)
      description: |
        Valida la extensión, el contenido real (magic bytes), macros y tamaño descomprimido de DOCX,
        y analiza el archivo con ClamAV antes de guardarlo. Después encola la extracción de texto.
        `courseId` debe ser el curso del token.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [courseId, file]
              properties:
                courseId:
                  type: integer
                file:
                  type: string
                  format: binary
                  description: PDF o DOCX de hasta 10 MB
      responses:
        "202":
          description: |
            Archivo aceptado; el procesamiento continúa en segundo plano. El estado es `PROCESSING`, o
            `UPLOADED` si la cola no respondió (se encola en menos de 5 minutos).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyllabusDocument"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |
            El mismo archivo ya fue cargado para el curso (`DUPLICATE_SYLLABUS`). `details[0].message`
            trae el id del sílabo existente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Archivo demasiado grande
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: |
            Tipo de archivo no permitido: `EXTENSION_NOT_ALLOWED`, `MIME_MISMATCH`,
            `MACROS_NOT_ALLOWED` o `ARCHIVE_TOO_LARGE`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: El antivirus detectó contenido malicioso (`MALWARE_DETECTED`); queda auditado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: |
            El antivirus no respondió (`ANTIVIRUS_UNAVAILABLE`) o falló la autenticación (ver `/session`).
            El archivo no se acepta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /syllabi/{syllabusId}:
    get:
      tags: [syllabi]
      operationId: getSyllabus
      summary: Estado y metadatos de un sílabo (RF-04)
      description: Un sílabo de otro curso responde 404, igual que uno que no existe.
      parameters:
        - $ref: "#/components/parameters/SyllabusId"
      responses:
        "200":
          description: Sílabo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyllabusDocument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /syllabi/{syllabusId}/extract:
    post:
      tags: [syllabi]
      operationId: startExtraction
      summary: Iniciar o reintentar la extracción (RF-04, RF-05)
      parameters:
        - $ref: "#/components/parameters/SyllabusId"
      responses:
        "202":
          description: Trabajo encolado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyllabusDocument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidTransition"

  /syllabi/{syllabusId}/extraction:
    get:
      tags: [syllabi]
      operationId: getExtraction
      summary: Última versión de la extracción, o la indicada
      parameters:
        - $ref: "#/components/parameters/SyllabusId"
        - name: version
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Extracción
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyllabusExtractionVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [syllabi]
      operationId: saveExtractionRevision
      summary: Guardar la revisión del docente como nueva versión (RF-06)
      parameters:
        - $ref: "#/components/parameters/SyllabusId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyllabusExtraction"
      responses:
        "201":
          description: Nueva versión creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyllabusExtractionVersion"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /proposals:
    post:
      tags: [proposals]
      operationId: createProposal
      summary: Generar una propuesta a partir de una versión de extracción (RF-07)
      description: |
        Requiere la capacidad `publish`. Cada unidad de la extracción es una sección y cada actividad
        un elemento hijo, con el tipo de Moodle según D-05 (provisional). Las fechas y ponderaciones son
        las de la extracción o `null`; nunca se inventan. La propuesta nace en `NEEDS_REVIEW`.

        El sílabo debe estar `REVIEWED` (el docente guardó su revisión). Si el mismo sílabo ya tiene una
        propuesta que no fue rechazada, responde 409 `PROPOSAL_EXISTS` y no la duplica, salvo que se
        envíe `confirmDuplicate: true`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [syllabusId, extractionVersion]
              properties:
                syllabusId:
                  type: string
                  format: uuid
                extractionVersion:
                  type: integer
                  minimum: 1
                confirmDuplicate:
                  type: boolean
                  description: Confirma que se quiere otra propuesta aunque el sílabo ya tenga una
      responses:
        "201":
          description: Propuesta creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: |
            `SYLLABUS_NOT_FOUND` (un sílabo de otro curso responde igual que uno inexistente) o
            `EXTRACTION_NOT_FOUND`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            `EXTRACTION_NOT_REVIEWED` (el docente aún no guardó su revisión), `EXTRACTION_INVALID` o
            `PROPOSAL_EXISTS` (`details[0].message` trae el id de la propuesta existente)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /proposals/{proposalId}:
    get:
      tags: [proposals]
      operationId: getProposal
      summary: Consultar una propuesta
      description: |
        Una propuesta de otro curso responde 404 (`PROPOSAL_NOT_FOUND`), igual que una inexistente. Incluye
        `issues`, la revisión del estado guardado.
      parameters:
        - $ref: "#/components/parameters/ProposalId"
      responses:
        "200":
          description: Propuesta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [proposals]
      operationId: updateProposal
      summary: Editar ítems de la propuesta (vuelve a NEEDS_REVIEW si estaba aprobada)
      description: |
        Requiere la capacidad `publish`. Reemplaza todos los ítems por los enviados; la posición es el
        orden del arreglo. Un ítem nuevo trae un UUID generado por el cliente. `moodleItemId` y
        `publishStatus` son de solo lectura y se ignoran. Una sección no tiene padre; cualquier otro ítem
        cuelga de una sección de la misma propuesta. Solo se edita en `DRAFT`, `NEEDS_REVIEW` y
        `APPROVED`; editar una propuesta aprobada borra la aprobación y la devuelve a `NEEDS_REVIEW`.
      parameters:
        - $ref: "#/components/parameters/ProposalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/ProposalItem"
      responses:
        "200":
          description: Propuesta actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            `PROPOSAL_NOT_EDITABLE` (el estado no admite ediciones), `ITEM_ID_CONFLICT` (un id ya
            pertenece a otra propuesta) o `PROPOSAL_CHANGED` (otra petición la cambió a la vez)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /proposals/{proposalId}/approve:
    post:
      tags: [proposals]
      operationId: approveProposal
      summary: Aprobar la propuesta (RF-08)
      description: |
        Requiere la capacidad `publish`. Solo se aprueba desde `NEEDS_REVIEW`, y solo si la revisión
        (`issues`) no tiene errores; las advertencias no lo impiden. Registra quién aprobó y cuándo.
      parameters:
        - $ref: "#/components/parameters/ProposalId"
      responses:
        "200":
          description: Propuesta aprobada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            `INVALID_TRANSITION` (el estado no permite aprobar), `PROPOSAL_HAS_ERRORS` (`details` lista
            los errores) o `PROPOSAL_CHANGED` (otra petición la cambió a la vez)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /proposals/{proposalId}/publish:
    post:
      tags: [proposals]
      operationId: publishProposal
      summary: Publicar en Moodle una propuesta aprobada (RF-09)
      description: |
        Requiere la capacidad `publish`. Solo se publica una propuesta `APPROVED`, o una `FAILED` para
        reanudarla. Exige `Idempotency-Key` y `{ "confirm": true }`: sin confirmación explícita no se crea
        nada.

        Responde 202 y la publicación sigue en segundo plano, un elemento a la vez, con la identidad y los
        permisos del docente. Repetir la petición con la misma clave devuelve la misma operación y no
        publica de nuevo; otra clave sobre una propuesta que ya se está publicando o se publicó responde 409.
        Moodle reconoce cada elemento por su id, así que reanudar tras un fallo no duplica lo creado. Las
        actividades se crean ocultas.
      parameters:
        - $ref: "#/components/parameters/ProposalId"
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: boolean
                  const: true
                  description: Confirmación explícita del docente
      responses:
        "202":
          description: Publicación iniciada, o la misma operación ya existente si se repite la clave
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishOperation"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            `INVALID_TRANSITION` (la propuesta no está aprobada ni fallida), `PROPOSAL_HAS_ERRORS`,
            `IDEMPOTENCY_KEY_REUSED` (la clave ya se usó en otra propuesta) o `PROPOSAL_CHANGED`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: |
            `PUBLISH_QUEUE_UNAVAILABLE`: no se pudo encolar. La propuesta queda `FAILED` y se puede reanudar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /proposals/{proposalId}/publish-operations/{operationId}:
    get:
      tags: [proposals]
      operationId: getPublishOperation
      summary: Progreso y resultado de una publicación
      description: |
        Una operación solo se consulta con su propuesta y en su curso; en otro caso responde 404
        (`PUBLISH_OPERATION_NOT_FOUND` o `PROPOSAL_NOT_FOUND`).
      parameters:
        - $ref: "#/components/parameters/ProposalId"
        - name: operationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Operación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishOperation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /assistant/chat:
    post:
      tags: [assistant]
      operationId: sendChatMessage
      summary: Enviar un mensaje al asistente (RF-10 a RF-14)
      description: |
        Con `Accept: text/event-stream` la respuesta se envía por eventos SSE (`token`, `tool`,
        `final`, `error`). Con `Accept: application/json` se devuelve la respuesta completa.

        **Formato de los eventos** (cada uno es `event: <nombre>` y `data: <JSON en una línea>`, separados por
        una línea en blanco). El plugin los lee con `moodle/local/ai_assistant/amd/src/sse.js`:

        | Evento  | `data`                                                  | Cuándo                                        |
        | ------- | ------------------------------------------------------ | --------------------------------------------- |
        | `tool`  | `{"name": "get_assignment_submissions"}`                | El asistente empieza a consultar datos        |
        | `token` | `{"text": "Tres "}`                                     | Un trozo de la respuesta, en orden            |
        | `final` | un `ChatResponse` completo                              | Siempre al terminar bien; su `answer` reemplaza a los tokens |
        | `error` | `{"code": "AI_PROVIDER_UNAVAILABLE", "message": "..."}` | El flujo no puede continuar; no se inventa respuesta |

        Orden esperado: cero o más `tool` y `token`, y un único `final` o `error`. Un flujo que se corta sin
        `final` ni `error` se muestra como respuesta interrumpida. Los errores previos al flujo (permisos, límite
        de uso, proveedor caído) se responden como JSON con su código HTTP. El texto de `answer` se muestra
        siempre como texto, nunca como HTML. `sources[].type` decide el enlace: `moodle_activity` abre
        `mod/view.php?id=<id>`, `moodle_gradebook` el calificador del curso y `document` solo si trae `url`.
        Una respuesta con `incompleteData: true` muestra el aviso de datos incompletos.

        Referencia ejecutable: `pnpm mock:ai` (`infra/mocks/ai-api.mjs`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courseId, message]
              properties:
                courseId:
                  type: integer
                conversationId:
                  type: [string, "null"]
                  format: uuid
                message:
                  type: string
                  minLength: 1
                  maxLength: 2000
            example:
              courseId: 42
              conversationId: null
              message: ¿Qué estudiantes no entregaron la tarea 3?
      responses:
        "200":
          description: Respuesta del asistente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          description: |
            `RATE_LIMITED`: límite de peticiones por usuario y minuto (Retry-After indica cuántos segundos
            esperar) o límite de uso y costo de IA por docente (RNF-07)
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Proveedor de IA no disponible (`AI_PROVIDER_UNAVAILABLE`); no se inventa respuesta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /assistant/conversations/{conversationId}:
    get:
      tags: [assistant]
      operationId: getConversation
      summary: Historial de una conversación propia
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Conversación
          content:
            application/json:
              schema:
                type: object
                required: [id, courseId, messages]
                properties:
                  id:
                    type: string
                    format: uuid
                  courseId:
                    type: integer
                  messages:
                    type: array
                    items:
                      type: object
                      required: [role, content, createdAt]
                      properties:
                        role:
                          type: string
                          enum: [user, assistant]
                        content:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No existe o pertenece a otro usuario (SEC-10)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /analytics/courses/{courseId}:
    get:
      tags: [analytics]
      operationId: getCourseAnalytics
      summary: Indicadores y señales del curso (RF-15, RF-16)
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: Indicadores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseAnalytics"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: No se pudieron leer las actividades o los estudiantes de Moodle (`MOODLE_UNAVAILABLE`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /analytics/courses/{courseId}/students/{studentId}:
    get:
      tags: [analytics]
      operationId: getStudentEvidence
      summary: Evidencias de un estudiante en el curso (RF-17)
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/StudentId"
      responses:
        "200":
          description: Evidencias observadas y cálculos, separados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentEvidence"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: El estudiante no está matriculado en el curso (`STUDENT_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: No se pudieron leer los datos de Moodle (`MOODLE_UNAVAILABLE`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /analytics/courses/{courseId}/students/{studentId}/recommendations:
    post:
      tags: [analytics]
      operationId: createRecommendation
      summary: Generar recomendaciones pedagógicas (RF-18)
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/StudentId"
      responses:
        "201":
          description: Recomendación generada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recommendation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: El estudiante no está matriculado en el curso (`STUDENT_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            Datos insuficientes para recomendar (`INSUFFICIENT_DATA`): sin porcentaje de entregas ni promedio de
            notas. `details` lista lo que falta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Límite diario de recomendaciones por docente (`RATE_LIMITED`); `Retry-After` indica cuánto esperar
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: |
            El proveedor de IA no respondió o la recomendación no cumplió las reglas de lenguaje tras un reintento
            (`AI_PROVIDER_UNAVAILABLE`), o no se pudieron leer los datos de Moodle (`MOODLE_UNAVAILABLE`). No se
            guarda nada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /recommendations/{recommendationId}/followups:
    post:
      tags: [analytics]
      operationId: addRecommendationFollowup
      summary: Registrar el seguimiento docente (RF-20)
      parameters:
        - name: recommendationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actionTaken]
              properties:
                actionTaken:
                  type: string
                  maxLength: 2000
                observedResult:
                  type: [string, "null"]
                  maxLength: 2000
      responses:
        "201":
          description: Seguimiento registrado
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /courses/{courseId}/activity-mappings:
    get:
      tags: [mappings]
      operationId: getActivityMappings
      summary: Unidades del sílabo revisado y actividades ya relacionadas
      description: |
        Requiere `use`. Las unidades y los resultados salen de la última versión del sílabo revisado del curso
        (`REVIEWED`); sin sílabo revisado las listas vienen vacías. Las actividades de Moodle las lista el plugin
        con la sesión del docente (`local_ai_assistant_get_course_activities`).
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: Unidades, resultados de aprendizaje y relaciones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityMappings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /courses/{courseId}/activity-mappings/{cmId}:
    put:
      tags: [mappings]
      operationId: saveActivityMapping
      summary: Relacionar una actividad con una unidad y sus resultados de aprendizaje
      description: |
        Requiere `publish`. Reemplaza la relación de la actividad y la marca `MANUAL`; una relación creada al
        publicar una propuesta (`PROPOSAL`) se reemplaza igual. La unidad y los resultados deben existir en el
        sílabo revisado.
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/CmId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [unitRef]
              properties:
                unitRef:
                  type: string
                  examples: ["gradingPeriods[0].units[1]"]
                learningOutcomeIds:
                  type: array
                  maxItems: 20
                  items:
                    type: string
      responses:
        "200":
          description: Relación guardada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityMapping"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`NO_REVIEWED_SYLLABUS`: el curso no tiene un sílabo revisado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [mappings]
      operationId: deleteActivityMapping
      summary: Quitar la relación de una actividad
      description: Requiere `publish`.
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/CmId"
      responses:
        "204":
          description: Relación quitada
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`MAPPING_NOT_FOUND`: la actividad no estaba relacionada"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/difficulty-rules:
    get:
      tags: [admin]
      operationId: listDifficultyRules
      summary: Reglas de señales de dificultad (CU-06)
      responses:
        "200":
          description: Reglas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DifficultyRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [admin]
      operationId: replaceDifficultyRules
      summary: Reemplazar las reglas institucionales
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/DifficultyRule"
      responses:
        "200":
          description: Reglas guardadas
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /audit:
    get:
      tags: [admin]
      operationId: listAuditEvents
      summary: Consultar auditoría (RF-19, CU-07)
      parameters:
        - name: courseId
          in: query
          schema:
            type: integer
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de eventos
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEvent"
                  nextCursor:
                    type: [string, "null"]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    pluginJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT firmado por el plugin con `sub`, `courseid`, `exp` (≤ 5 min) y `jti`.

  parameters:
    SyllabusId:
      name: syllabusId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        type: integer
    CmId:
      name: cmId
      in: path
      required: true
      description: Id de la actividad en Moodle (course module)
      schema:
        type: integer
        minimum: 1
    StudentId:
      name: studentId
      in: path
      required: true
      schema:
        type: integer
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

  responses:
    ValidationError:
      description: Datos de entrada inválidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: |
        JWT ausente, inválido, expirado o reutilizado. `code` es `TOKEN_MISSING`, `TOKEN_INVALID`,
        `TOKEN_EXPIRED` o `TOKEN_REPLAYED`. Cada token sirve para una sola petición.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        Sin permiso sobre el curso (`FORBIDDEN_COURSE`: el usuario no tiene
        `local/ai_assistant:use` o el curso de la ruta no es el del token) o sobre la operación
        (`FORBIDDEN_CAPABILITY`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Recurso inexistente o fuera del alcance del usuario
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidTransition:
      description: El estado actual no permite la operación
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          examples: [FORBIDDEN_COURSE]
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string

    Health:
      type: object
      required: [status, dependencies]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        dependencies:
          type: object
          additionalProperties:
            type: string
            enum: [ok, down]

    SyllabusDocument:
      type: object
      required: [id, courseId, filename, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        courseId:
          type: integer
        filename:
          type: string
        status:
          type: string
          enum: [UPLOADED, REJECTED, PROCESSING, TEXT_READY, EXTRACTED, REVIEWED, FAILED]
        progress:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
        pageCount:
          type: [integer, "null"]
          description: Páginas del documento; en DOCX son estimadas
        textConfidence:
          type: [string, "null"]
          enum: [high, low, null]
          description: "`low` si parte del texto salió de OCR"
        errorCode:
          type: [string, "null"]
          description: |
            Motivo de `FAILED`: `ENCRYPTED_DOCUMENT`, `CORRUPT_DOCUMENT`, `EMPTY_DOCUMENT`,
            `DOCUMENT_TOO_COMPLEX`, `INVALID_WORKER_RESULT` o `TEXT_EXTRACTION_FAILED`
        latestExtractionVersion:
          type: [integer, "null"]
        createdAt:
          type: string
          format: date-time

    Session:
      type: object
      required: [moodleUserId, courseId, roles, capabilities]
      properties:
        moodleUserId:
          type: integer
        courseId:
          type: integer
        roles:
          type: array
          description: Roles del usuario en el curso según Moodle
          items:
            type: string
        capabilities:
          type: object
          required: [use, publish, viewanalytics]
          properties:
            use:
              type: boolean
            publish:
              type: boolean
            viewanalytics:
              type: boolean

    SyllabusExtraction:
      description: |
        Cumple el JSON Schema generado desde `packages/contracts`
        (`json-schema/syllabus-extraction-1.0.json`).
      type: object

    SyllabusExtractionVersion:
      type: object
      required: [version, schemaVersion, source, content, consistencyIssues, createdAt]
      properties:
        version:
          type: integer
        schemaVersion:
          type: string
          const: "1.0"
        source:
          type: string
          enum: [AI, TEACHER]
        content:
          $ref: "#/components/schemas/SyllabusExtraction"
        consistencyIssues:
          type: array
          items:
            type: object
            required: [code, path, message]
            properties:
              code:
                type: string
              path:
                type: string
              message:
                type: string
        createdAt:
          type: string
          format: date-time

    ProposalItem:
      type: object
      required: [itemType, title, position]
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: [string, "null"]
          format: uuid
        itemType:
          type: string
          enum: [SECTION, ASSIGN, FORUM, QUIZ, LABEL, PAGE]
        title:
          type: string
        description:
          type: [string, "null"]
        position:
          type: integer
          description: Orden de visualización; en la edición se toma del orden del arreglo
        unitRef:
          type: string
          description: |
            Ruta de la unidad en la extracción (`gradingPeriods[0].units[1]`). Ubica el periodo de
            calificación para validar ponderaciones. Si se omite, un ítem hereda el de su sección.
        learningOutcomeIds:
          type: array
          items:
            type: string
        dueDate:
          type: [string, "null"]
          format: date
        weight:
          type: [number, "null"]
          minimum: 0
          maximum: 100
        moodleItemId:
          type: [integer, "null"]
          readOnly: true
        publishStatus:
          type: string
          enum: [PENDING, CREATED, FAILED]
          readOnly: true

    Proposal:
      type: object
      required: [id, courseId, status, extractionVersion, items]
      properties:
        id:
          type: string
          format: uuid
        courseId:
          type: integer
        syllabusId:
          type: string
          format: uuid
        extractionVersion:
          type: integer
        status:
          type: string
          enum: [DRAFT, NEEDS_REVIEW, APPROVED, PUBLISHING, PUBLISHED, REJECTED, FAILED]
        approvedBy:
          type: [integer, "null"]
        approvedAt:
          type: [string, "null"]
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProposalItem"
        lastPublishOperation:
          readOnly: true
          description: Última publicación, para retomar su seguimiento al recargar la página
          oneOf:
            - type: "null"
            - type: object
              required: [id, status]
              properties:
                id:
                  type: string
                  format: uuid
                status:
                  type: string
                  enum: [RUNNING, SUCCEEDED, FAILED]
        issues:
          type: array
          readOnly: true
          description: Revisión del estado guardado. Los `error` impiden aprobar; los `warning`, no.
          items:
            $ref: "#/components/schemas/ProposalIssue"

    ProposalIssue:
      type: object
      required: [code, severity, itemId, message]
      properties:
        code:
          type: string
          enum:
            - EMPTY_PROPOSAL
            - EMPTY_TITLE
            - ITEM_TYPE_NOT_ENABLED
            - PERIOD_WEIGHTS_EXCEED_TOTAL
            - PERIOD_WEIGHTS_NOT_TOTAL
            - ACTIVITY_WITHOUT_OUTCOME
            - SECTION_WITHOUT_ACTIVITIES
        severity:
          type: string
          enum: [error, warning]
        itemId:
          type: [string, "null"]
          format: uuid
          description: Ítem al que se refiere; `null` si afecta a la propuesta completa
        message:
          type: string

    PublishOperation:
      type: object
      required: [id, proposalId, status, totalCount, createdCount, failedCount, failures, createdAt]
      properties:
        id:
          type: string
          format: uuid
        proposalId:
          type: string
          format: uuid
        status:
          type: string
          enum: [RUNNING, SUCCEEDED, FAILED]
        totalCount:
          type: integer
          description: Elementos de la propuesta
        createdCount:
          type: integer
          description: Elementos creados en esta operación
        failedCount:
          type: integer
        failures:
          type: array
          description: Elementos que no se crearon. La publicación se detiene en el primer fallo.
          items:
            type: object
            required: [itemId, error]
            properties:
              itemId:
                type: string
                format: uuid
              error:
                type: string
                description: |
                  `MOODLE_PERMISSION`, `MOODLE_UNAVAILABLE`, `MOODLE_BAD_RESPONSE`,
                  `MOODLE_ERROR:<código de Moodle>` o `PUBLISH_ERROR`
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time

    ChatResponse:
      type: object
      required: [conversationId, answer, generatedAt, sources]
      properties:
        conversationId:
          type: string
          format: uuid
        intent:
          type: [string, "null"]
        answer:
          type: string
        data:
          type: [object, "null"]
          description: |
            Datos estructurados devueltos por las herramientas usadas, con el nombre de la herramienta como clave
            (una segunda llamada a la misma herramienta usa `nombre#2`). Si `answer` menciona estudiantes, trae además
            `students`: una lista de `{alias, studentId}` con los seudónimos (`Estudiante#NNNNNNNN`) y el id de Moodle
            correspondiente. Los nombres no pasan por el backend: el plugin sustituye cada alias por el nombre que
            obtiene de Moodle con ese id (ADR-010).
        generatedAt:
          type: string
          format: date-time
        sources:
          type: array
          items:
            type: object
            required: [type, id]
            properties:
              type:
                type: string
                enum: [moodle_activity, moodle_gradebook, document]
              id:
                type: [integer, string]
              page:
                type: [integer, "null"]
              url:
                type: [string, "null"]
                format: uri
        incompleteData:
          type: boolean
          description: Verdadero si faltaron datos para responder por completo

    Indicator:
      type: object
      required: [key, label, value, definition]
      properties:
        key:
          type: string
        label:
          type: string
        value:
          type: [number, "null"]
        unit:
          type: [string, "null"]
        definition:
          type: string

    CourseAnalytics:
      description: |
        Las señales solo traen el id del estudiante: el plugin resuelve los nombres con Moodle (función AJAX
        `local_ai_assistant_get_course_students`), así que ni los nombres ni los datos personales pasan por el
        backend o el proveedor de IA (ADR-010). Una señal debe explicar por qué existe (`explanation`) y no es
        un diagnóstico. Un indicador sin dato lleva `value: null` (se muestra como guion, nunca como cero).
      type: object
      required: [courseId, computedAt, indicators, signals]
      properties:
        courseId:
          type: integer
        computedAt:
          type: string
          format: date-time
        indicators:
          type: array
          items:
            $ref: "#/components/schemas/Indicator"
        signals:
          type: array
          items:
            type: object
            required: [studentId, rule, explanation]
            properties:
              studentId:
                type: integer
              rule:
                type: string
              explanation:
                type: string

    StudentEvidence:
      type: object
      required: [courseId, studentId, observed, computed, unknown]
      properties:
        courseId:
          type: integer
        studentId:
          type: integer
        observed:
          type: array
          description: |
            Datos observados en Moodle, tal como están. El plugin los muestra sin interpretarlos: `{label, value}`
            se muestra como una fila; cualquier otro objeto, campo por campo.
          items:
            type: object
        computed:
          type: array
          items:
            $ref: "#/components/schemas/Indicator"
        unknown:
          type: array
          description: Información que falta para concluir
          items:
            type: string

    Recommendation:
      type: object
      required: [id, evidenceSummary, strategies, missingInformation, followUpIndicators]
      properties:
        id:
          type: string
          format: uuid
        evidenceSummary:
          type: array
          items:
            type: string
        strengths:
          type: array
          items:
            type: string
        difficulties:
          type: array
          items:
            type: string
        missingInformation:
          type: array
          items:
            type: string
        strategies:
          type: array
          items:
            type: string
        reinforcementActivities:
          type: array
          items:
            type: string
        followUpIndicators:
          type: array
          items:
            type: string

    ActivityMapping:
      type: object
      required: [moodleCmId, unitRef, learningOutcomeIds, source]
      properties:
        moodleCmId:
          type: integer
        unitRef:
          type: string
          description: Ruta de la unidad en la extracción
        learningOutcomeIds:
          type: array
          items:
            type: string
        source:
          type: string
          enum: [PROPOSAL, MANUAL]
          description: "`PROPOSAL` si se creó al publicar una propuesta; `MANUAL` si la eligió el docente"

    ActivityMappings:
      type: object
      required: [syllabusId, extractionVersion, units, outcomes, mappings]
      properties:
        syllabusId:
          type: [string, "null"]
          format: uuid
        extractionVersion:
          type: [integer, "null"]
        units:
          type: array
          items:
            type: object
            required: [unitRef, title, periodName, learningOutcomeIds]
            properties:
              unitRef:
                type: string
              title:
                type: string
              periodName:
                type: string
              learningOutcomeIds:
                type: array
                items:
                  type: string
        outcomes:
          type: array
          items:
            type: object
            required: [id, description]
            properties:
              id:
                type: string
              description:
                type: string
        mappings:
          type: array
          items:
            $ref: "#/components/schemas/ActivityMapping"

    DifficultyRule:
      type: object
      required: [rule, enabled, params]
      properties:
        courseId:
          type: [integer, "null"]
        rule:
          type: string
          enum:
            - MISSING_REQUIRED
            - GRADE_BELOW_THRESHOLD
            - SUSTAINED_DECLINE
            - REPEATED_OUTCOME_DIFFICULTY
        enabled:
          type: boolean
        params:
          type: object

    AuditEvent:
      type: object
      required: [id, action, outcome, createdAt]
      properties:
        id:
          type: string
          format: uuid
        actorMoodleId:
          type: [integer, "null"]
        courseId:
          type: [integer, "null"]
        action:
          type: string
        resourceType:
          type: [string, "null"]
        resourceId:
          type: [string, "null"]
        outcome:
          type: string
          enum: [SUCCESS, DENIED, ERROR]
        createdAt:
          type: string
          format: date-time
