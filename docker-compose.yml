# Servicios de desarrollo del backend. Moodle se levanta aparte con moodle-docker (ADR-011):
#   infra/scripts/moodle.sh setup && infra/scripts/moodle.sh up
#
# Uso:
#   docker compose up -d                  # base auxiliar y Redis (el backend corre en el host: pnpm dev)
#   docker compose --profile antivirus up -d   # además, ClamAV para analizar los archivos subidos
#   docker compose --profile api up -d    # además, el backend en un contenedor (incluye ClamAV)
services:
  app-db:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_DB: ai_assistant
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?Define APP_DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:${APP_DB_PORT:-5433}:5432"
    volumes:
      - app_db_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ai_assistant"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.8.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Antivirus de los archivos subidos (RF-03). La imagen trae firmas y freshclam las actualiza; el
  # primer arranque tarda unos minutos y usa alrededor de 1,5 GB de memoria.
  clamav:
    image: clamav/clamav:1.5.4
    profiles: ["antivirus", "api"]
    ports:
      - "127.0.0.1:${CLAMAV_PORT:-3310}:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 5m
      retries: 5

  api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://app:${APP_DB_PASSWORD}@app-db:5432/ai_assistant
      REDIS_URL: redis://redis:6379
      # Limitación conocida: Moodle redirige toda petición a su wwwroot (http://localhost:8000), que no
      # existe dentro de este contenedor, así que /health informará "moodle": "down". Para desarrollar
      # contra Moodle, ejecuta el backend en el host (pnpm dev). En producción, Moodle y el backend usan
      # nombres DNS reales y este valor apunta al wwwroot de Moodle.
      MOODLE_BASE_URL: ${MOODLE_BASE_URL_FROM_DOCKER:-http://host.docker.internal:8000}
      MOODLE_TOKEN: ${MOODLE_TOKEN:-}
      PLUGIN_JWT_SECRET: ${PLUGIN_JWT_SECRET:-}
      CLAMAV_URL: tcp://clamav:3310
      STORAGE_DIR: /var/lib/smart-lms/storage
    volumes:
      - file_storage:/var/lib/smart-lms/storage
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      app-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  app_db_data:
  redis_data:
  clamav_data:
  # Archivos subidos; el worker documental lo monta en solo lectura.
  file_storage:
