# Despliegue de producción del backend (Sprint 13). Moodle no está aquí: es el de la institución.
#
# Qué hace distinto del docker-compose.yml de desarrollo:
#   - Solo el proxy (TLS) publica puertos; la base, Redis, ClamAV y el worker viven en una red interna.
#   - Los secretos NO están en el repositorio ni en este archivo: se leen de archivos de ${SECRETS_DIR}
#     (ver .env.production.example y docs/operacion/instalacion-y-operacion.md).
#   - Cada servicio tiene límites de memoria, CPU y procesos, reinicio automático y rotación de logs.
#   - Los contenedores corren sin privilegios y con el sistema de archivos de solo lectura donde es posible.
#
# Uso (en el servidor):
#   cp .env.production.example .env.production   # y completar
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#   docker compose --env-file .env.production -f docker-compose.prod.yml run --rm migrate
name: smart-lms

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardening: &hardening
  restart: unless-stopped
  logging: *logging
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

services:
  # Termina TLS (certificados de Let's Encrypt automáticos) y reenvía /api/v1 al backend.
  proxy:
    <<: *hardening
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    cap_add: ["NET_BIND_SERVICE"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?Define API_DOMAIN en .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?Define ACME_EMAIL en .env.production}
    volumes:
      - ./infra/docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100
    networks: [edge]
    depends_on:
      api:
        condition: service_healthy

  api:
    <<: *hardening
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # Variables secretas (DATABASE_URL, REDIS_URL, MOODLE_TOKEN, PLUGIN_JWT_SECRET...) viven fuera del repo.
    env_file: ${SECRETS_DIR:?Define SECRETS_DIR en .env.production}/api.env
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MOODLE_BASE_URL: ${MOODLE_BASE_URL:?Define MOODLE_BASE_URL en .env.production}
      CORS_ORIGINS: ${MOODLE_BASE_URL}
      CLAMAV_URL: tcp://clamav:3310
      STORAGE_DIR: /var/lib/smart-lms/storage
    volumes:
      - file_storage:/var/lib/smart-lms/storage
    read_only: true
    tmpfs:
      - /tmp
    # `edge` da salida a Moodle y entrada al proxy; `internal` llega a la base, Redis y ClamAV.
    networks: [edge, internal]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 200
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      app-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy

  # Aplica las migraciones de Prisma. Se ejecuta a mano antes de cada versión nueva (ver el manual).
  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    env_file: ${SECRETS_DIR}/api.env
    networks: [internal]
    depends_on:
      app-db:
        condition: service_healthy

  # Extrae el texto de los sílabos (ADR-003, ADR-013): sin base de datos, sin Moodle, sin salida a internet.
  document-worker:
    <<: *hardening
    build:
      context: .
      dockerfile: apps/document-worker/Dockerfile
    # Solo contiene REDIS_URL (con la contraseña de Redis).
    env_file: ${SECRETS_DIR}/worker.env
    environment:
      STORAGE_DIR: /var/lib/smart-lms/storage
      WORKER_CONCURRENCY: 2
    volumes:
      - file_storage:/var/lib/smart-lms/storage:ro
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 200
    networks: [internal]
    depends_on:
      redis:
        condition: service_healthy

  app-db:
    <<: *hardening
    image: pgvector/pgvector:0.8.6-pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    # La imagen de Postgres necesita estas capacidades para arrancar y cambiar de usuario.
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    environment:
      POSTGRES_DB: ai_assistant
      POSTGRES_USER: app
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - app_db_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 200
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ai_assistant"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    <<: *hardening
    image: redis:8.8.4-alpine@sha256:c027ae0f677dcf73d74038256f5b88c9ba7b11ccbfae97e96a9f091208d36125
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$(cat /run/secrets/redis_password)"
    secrets: [redis_password]
    volumes:
      - redis_data:/data
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    networks: [internal]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "$$(cat /run/secrets/redis_password)" --no-auth-warning ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  # Antivirus de los archivos subidos (RF-03). Sin él, el backend no arranca en producción.
  clamav:
    <<: *hardening
    image: clamav/clamav:1.5.4@sha256:45fe5149fbee5a46509c9848ef20d0c354b7b2323c9369f285939a37cf33422a
    cap_drop: []
    volumes:
      - clamav_data:/var/lib/clamav
    mem_limit: 2g
    cpus: 1.0
    networks: [edge, internal]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 5m
      retries: 5

networks:
  # Publica el proxy y da salida a internet (Moodle, actualizaciones de firmas de ClamAV).
  edge: {}
  # Sin salida a internet ni puertos publicados.
  internal:
    internal: true

secrets:
  db_password:
    file: ${SECRETS_DIR}/db_password
  redis_password:
    file: ${SECRETS_DIR}/redis_password

volumes:
  app_db_data:
  redis_data:
  clamav_data:
  caddy_data:
  caddy_config:
  # Archivos subidos; el worker documental lo monta en solo lectura.
  file_storage:
